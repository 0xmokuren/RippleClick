name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check release workflow boundaries offline
        run: python3 Tests/ReleaseWorkflow/test_release_security.py

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Create App Bundle
        run: bash scripts/bundle.sh

      - name: Upload App Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: RippleClick.app
          path: RippleClick.app

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict

  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check formatting
        run: |
          brew install swift-format
          swift-format lint --strict --recursive Sources/ Tests/
