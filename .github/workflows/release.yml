name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      unsigned_sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" == v* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test without real login-item operations
        run: swift test --skip LivePopoverTests

      - name: Build app without release credentials
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_IDENTITY: "-"
        run: bash scripts/bundle.sh "$VERSION"

      - name: Package build and release notes
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned-release"
          ditto -c -k --keepParent RippleClick.app "$RUNNER_TEMP/unsigned-release/unsigned-app.zip"
          cp Resources/RippleClick.entitlements "$RUNNER_TEMP/unsigned-release/signing-entitlements.plist"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          {
            printf '%s\n\n' "## What's Changed"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "$PREVIOUS_TAG..$GITHUB_SHA" --pretty=format:'- %s' --no-merges
            else
              git log "$GITHUB_SHA" --pretty=format:'- %s' --no-merges
            fi
            printf '\n\n%s\n\n' '## Installation'
            printf '%s\n' '```bash' 'brew tap 0xmokuren/tap' 'brew install --cask rippleclick' '```'
            printf '\nOr download `RippleClick-%s.zip` below.\n' "$VERSION"
          } > "$RUNNER_TEMP/unsigned-release/release-notes.md"
          SHA="$(shasum -a 256 "$RUNNER_TEMP/unsigned-release/unsigned-app.zip" | awk '{print $1}')"
          printf 'sha256=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned build only
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unsigned-release/unsigned-app.zip
            ${{ runner.temp }}/unsigned-release/signing-entitlements.plist
            ${{ runner.temp }}/unsigned-release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: macos-15
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/unsigned-release

      # Secrets exist only in this step, and its EXIT trap owns their cleanup.
      - name: Sign and notarize using existing credentials
        id: sign
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA: ${{ needs.build.outputs.unsigned_sha256 }}
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: bash scripts/release/sign-notarize.sh "$RUNNER_TEMP/unsigned-release" "$RUNNER_TEMP/signed-release" "$VERSION" "$EXPECTED_SHA"

      - name: Upload signed public payload only
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/signed-release/RippleClick-${{ needs.build.outputs.version }}.zip
            ${{ runner.temp }}/signed-release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/signed-release
      - name: Verify signed archive transfer
        env:
          EXPECTED_SHA: ${{ needs.sign.outputs.sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 2
          printf '%s  %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/signed-release/RippleClick-$VERSION.zip" | sha256sum -c -
      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release exists. Retry only failed downstream jobs; do not rerun publication.'
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: RippleClick v${{ needs.build.outputs.version }}
          body_path: ${{ runner.temp }}/signed-release/release-notes.md
          files: ${{ runner.temp }}/signed-release/RippleClick-${{ needs.build.outputs.version }}.zip
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: false

  tap:
    needs: [build, sign, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # No certificate or notarization secret enters this runner.
      - name: Update Homebrew Cask with the existing tap credential
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.sign.outputs.sha256 }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/release/update-tap.sh "$VERSION" "$SHA256"
