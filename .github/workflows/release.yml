name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Developer ID 証明書と公証用 API キーを一時キーチェーン・一時ファイルに展開する。
      # どれか1つでも欠けていればリリースを作る前に止める（未署名版を配布しないため）。
      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          for name in DEVELOPER_ID_CERT_P12_BASE64 DEVELOPER_ID_CERT_PASSWORD NOTARY_API_KEY_P8_BASE64 \
                      SIGNING_IDENTITY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is not set"
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          NOTARY_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_API_KEY_ID}.p8"
          echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_API_KEY_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "NOTARY_API_KEY_PATH=$NOTARY_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build App Bundle
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: bash scripts/bundle.sh "${{ steps.version.outputs.version }}"

      - name: Notarize App Bundle
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: bash scripts/notarize.sh RippleClick.app

      - name: Create ZIP
        run: ditto -c -k --keepParent RippleClick.app "RippleClick-${{ steps.version.outputs.version }}.zip"

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 RippleClick-${{ steps.version.outputs.version }}.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$GITHUB_REF_NAME" ]; then
            COMMITS=$(git log "$PREV_TAG".."$GITHUB_REF_NAME" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          fi
          {
            echo "notes<<EOF"
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Installation"
            echo ""
            echo "\`\`\`bash"
            echo "brew tap 0xmokuren/tap"
            echo "brew install --cask rippleclick"
            echo "\`\`\`"
            echo ""
            echo "Or download \`RippleClick-${{ steps.version.outputs.version }}.zip\` below."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "RippleClick v${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          files: "RippleClick-${{ steps.version.outputs.version }}.zip"
          generate_release_notes: false

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/0xmokuren/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Casks/rippleclick.rb << 'RUBY'
          cask "rippleclick" do
            version "${{ steps.version.outputs.version }}"
            sha256 "${{ steps.sha.outputs.sha256 }}"

            url "https://github.com/0xmokuren/RippleClick/releases/download/v#{version}/RippleClick-#{version}.zip"
            name "RippleClick"
            desc "macOS menu bar utility that shows ripple effects on left click"
            homepage "https://github.com/0xmokuren/RippleClick"

            app "RippleClick.app"

            zap trash: [
              "~/Library/Preferences/com.0xmokuren.RippleClick.plist",
            ]
          end
          RUBY

          # Remove leading spaces from heredoc
          sed -i '' 's/^          //' Casks/rippleclick.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/rippleclick.rb
          git commit -m "Update RippleClick to v${{ steps.version.outputs.version }}"
          git push

      - name: Clean up signing materials
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${NOTARY_API_KEY_PATH:-}"
